name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: shellcheck 0.9 and 0.11 disagree (0.9 flags SC2015 where 0.11
      # does not), so an unpinned runner can fail a build that passes locally.
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: style
      - name: Syntax check under bash 3.2 semantics
        run: bash -n aws-baseline-audit.sh
